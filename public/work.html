<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASSUZ — Selected Work</title>
  <link rel="icon" type="image/jpeg" href="/avatar.JPG" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg: #060606;
      --color-bg-card: #111111;
      --color-surface: #151515;
      --color-border: rgba(255, 255, 255, 0.06);
      --color-border-hover: rgba(255, 255, 255, 0.12);
      --color-text: #f2f2f2;
      --color-text-secondary: #8a8a8a;
      --color-text-muted: #4a4a4a;
      --color-accent: #c8ff00;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --gutter: clamp(1.5rem, 4vw, 4rem);
      --container-max: 1400px;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-md, 1.5rem) var(--gutter);
      z-index: 1000;
      background: rgba(6, 6, 6, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--color-border);
    }

    .topbar__logo { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; }
    .topbar__logo .accent { color: var(--color-accent); }
    .topbar__back {
      font-size: 0.8rem; font-weight: 500; letter-spacing: 0.08em;
      color: var(--color-text-secondary);
      display: inline-flex; align-items: center; gap: 0.4rem;
      transition: color 0.3s var(--ease-out-expo);
    }
    .topbar__back:hover { color: var(--color-accent); }

    .work-page { max-width: var(--container-max); margin: 0 auto; padding: clamp(7rem, 12vw, 11rem) var(--gutter) 6rem; }

    .work-page__head { margin-bottom: clamp(2.5rem, 5vw, 4rem); }
    .work-page__tag {
      font-size: 0.72rem; font-weight: 400; color: var(--color-text-muted);
      letter-spacing: 0.12em; display: block; margin-bottom: 0.5rem;
    }
    .work-page__title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 900; letter-spacing: -0.02em; line-height: 1.05;
    }
    .work-page__title .italic { font-style: italic; font-weight: 400; color: var(--color-accent); }
    .work-page__count { margin-top: 1rem; font-size: 0.85rem; color: var(--color-text-muted); letter-spacing: 0.05em; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(1rem, 2vw, 1.75rem);
    }

    .card {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color 0.3s var(--ease-out-expo), transform 0.6s var(--ease-out-expo);
      cursor: pointer;
    }
    .card:hover { border-color: var(--color-border-hover); transform: translateY(-8px); }
    .card__image { aspect-ratio: 4 / 5; overflow: hidden; background: #111; }
    .card__image img, .card__image video {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.8s var(--ease-out-expo);
    }
    .card:hover .card__image img, .card:hover .card__image video { transform: scale(1.05); }
    .card__info { padding: 1rem 1.25rem 1.25rem; }
    .card__cat {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--color-text-muted); display: block; margin-bottom: 0.4rem;
    }
    .card__name { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; transition: color 0.3s var(--ease-out-expo); }
    .card:hover .card__name { color: var(--color-accent); }
    .card__desc { font-size: 0.85rem; color: var(--color-text-secondary); line-height: 1.6; margin-top: 0.4rem; }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; z-index: 15000;
      background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(30px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: opacity 0.4s var(--ease-out-expo), visibility 0.4s;
    }
    .lightbox.open { opacity: 1; visibility: visible; }
    .lightbox__img { max-width: 85vw; max-height: 85vh; object-fit: contain; border-radius: 8px; transform: scale(0.9); transition: transform 0.5s var(--ease-out-expo); box-shadow: 0 30px 100px rgba(0,0,0,0.5); }
    .lightbox.open .lightbox__img { transform: scale(1); }
    .lightbox__close, .lightbox__nav {
      position: absolute; width: 48px; height: 48px; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: var(--color-text); cursor: pointer;
      transition: all 0.3s var(--ease-out-expo);
    }
    .lightbox__close { top: 1.5rem; right: 1.5rem; }
    .lightbox__nav { top: 50%; transform: translateY(-50%); width: 52px; height: 52px; background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.08); }
    .lightbox__nav--prev { left: 1.5rem; }
    .lightbox__nav--next { right: 1.5rem; }
    .lightbox__close:hover, .lightbox__nav:hover { background: var(--color-accent); color: var(--color-bg); border-color: var(--color-accent); }
    .lightbox__info { position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%); text-align: center; }
    .lightbox__info-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; display: block; margin-bottom: 0.15rem; }
    .lightbox__info-cat { font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); }
    .lightbox__counter { position: absolute; bottom: 1.5rem; right: 1.5rem; font-size: 0.8rem; color: var(--color-text-muted); }

    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) {
      .topbar { flex-wrap: wrap; gap: 0.75rem; padding: 1rem var(--gutter); }
      .grid { grid-template-columns: 1fr; }
      .work-page { padding: 8rem var(--gutter) 4rem; }
      .lightbox__nav { width: 40px; height: 40px; }
      .lightbox__nav--prev { left: 0.5rem; }
      .lightbox__nav--next { right: 0.5rem; }
      .lightbox__img { max-width: 95vw; max-height: 78vh; }
      .lightbox__info { width: 90%; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/" class="topbar__logo">ASSUZ<span class="accent">.</span></a>
    <a href="/#services" class="topbar__back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to work
    </a>
  </div>

  <main class="work-page" id="workPage">
    <header class="work-page__head">
      <span class="work-page__tag" id="workTag">Selected Work</span>
      <h1 class="work-page__title" id="workTitle"></h1>
      <p class="work-page__count" id="workCount"></p>
    </header>
    <div class="grid" id="workGrid"></div>
  </main>

  <div class="lightbox" id="lightbox">
    <img class="lightbox__img" id="lightboxImg" src="" alt="" />
    <button class="lightbox__close" id="lightboxClose" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Previous">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Next">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="lightbox__info">
      <span class="lightbox__info-title" id="lightboxTitle"></span>
      <span class="lightbox__info-cat" id="lightboxCat"></span>
    </div>
    <span class="lightbox__counter" id="lightboxCounter"></span>
  </div>

  <script>
    const works = {
      1: { src: '/works/1.jpg', title: 'Desi Hip-Hop', category: 'Poster Design' },
      2: { src: '/works/2.jpg', title: 'Travis Scott × Jordan', category: 'Sneaker Art' },
      3: { src: '/works/3.jpg', title: 'The Weeknd', category: 'Album Art' },
      4: { src: '/works/4.jpg', title: 'Travis Scott — Cactus Jack', category: 'Concert Poster' },
      5: { src: '/works/5.jpg', title: 'Playboi Carti — I AM MUSIC', category: 'Editorial Design' },
      6: { src: '/works/6.jpg', title: 'Nike Air Jordan — We Fly', category: 'Brand Poster' },
      7: { src: '/works/7.jpg', title: 'Kendrick Lamar — DAMN.', category: 'Album Concept' },
      8: { src: '/works/8.jpg', title: 'Kendrick Lamar — GNX', category: 'Typographic Poster' },
    };

    const projects = {
      Beeyond: {
        category: 'Travel Brand',
        description: 'Complete brand identity for a travel discovery platform — logo, UI, and visual system.',
        cover: '/projects/Beeyond/1.png',
        images: Array.from({ length: 14 }, (_, i) => `/projects/Beeyond/${i + 1}.png`),
      },
      Sunity: {
        category: 'Energy Brand',
        description: 'Brand design for a solar energy company — bold visuals for sustainable power.',
        cover: '/projects/Sunity/1.png',
        images: ['/projects/Sunity/1.png','/projects/Sunity/2.png','/projects/Sunity/2.5.png','/projects/Sunity/3.png','/projects/Sunity/4.png','/projects/Sunity/5.png','/projects/Sunity/6.png','/projects/Sunity/7.png','/projects/Sunity/8.png','/projects/Sunity/9.png','/projects/Sunity/10.png','/projects/Sunity/11.png'],
      },
      Uri: {
        category: 'Mobile App',
        description: 'UI/UX design for a gamified language learning app — fun, engaging, modern.',
        cover: '/projects/Uri/1.png',
        images: [...Array.from({ length: 13 }, (_, i) => `/projects/Uri/${i + 1}.png`), '/projects/Uri/15.mp4'],
      },
    };

    const config = {
      poster: { tag: 'Service', title: 'Poster <span class="italic">Design</span>', works: [1, 4, 6, 8] },
      brand:  { tag: 'Service', title: 'Brand <span class="italic">Identity</span>', projects: ['Beeyond', 'Uri', 'Sunity'] },
      album:  { tag: 'Service', title: 'Album & <span class="italic">Cover Art</span>', works: [3, 5, 7] },
      social: { tag: 'Service', title: 'Social Media <span class="italic">Design</span>', works: [2, 6, 8] },
    };

    const params = new URLSearchParams(window.location.search);
    const cat = params.get('cat') || 'poster';
    const conf = config[cat] || config.poster;

    document.getElementById('workTitle').innerHTML = conf.title;
    document.getElementById('workTag').textContent = conf.tag;

    const grid = document.getElementById('workGrid');
    const lightboxItems = [];

    if (conf.works) {
      conf.works.forEach(id => {
        const w = works[id];
        if (!w) return;
        lightboxItems.push({ src: w.src, title: w.title, cat: w.category });
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card__image"><img src="${w.src}" alt="${w.title}" loading="lazy" /></div>
          <div class="card__info">
            <span class="card__cat">${w.category}</span>
            <h3 class="card__name">${w.title}</h3>
          </div>`;
        card.addEventListener('click', () => openLightbox(lightboxItems.length - 1));
        grid.appendChild(card);
      });
      document.getElementById('workCount').textContent = conf.works.length + ' selected works';
    } else if (conf.projects) {
      conf.projects.forEach(name => {
        const p = projects[name];
        if (!p) return;
        lightboxItems.push(...p.images.map(src => ({ src, title: name, cat: p.category })));
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card__image"><img src="${p.cover}" alt="${name}" loading="lazy" /></div>
          <div class="card__info">
            <span class="card__cat">${p.category}</span>
            <h3 class="card__name">${name}</h3>
            <p class="card__desc">${p.description}</p>
          </div>`;
        const startIndex = lightboxItems.length - p.images.length;
        card.addEventListener('click', () => openLightbox(startIndex));
        grid.appendChild(card);
      });
      document.getElementById('workCount').textContent = conf.projects.length + ' brand case studies';
    }

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightboxImg');
    const lbTitle = document.getElementById('lightboxTitle');
    const lbCat = document.getElementById('lightboxCat');
    const lbCounter = document.getElementById('lightboxCounter');
    let currentIndex = 0;

    function render() {
      const item = lightboxItems[currentIndex];
      if (item.src.endsWith('.mp4')) {
        lbImg.outerHTML = `<video class="lightbox__img" id="lightboxImg" src="${item.src}" autoplay loop muted playsinline></video>`;
      } else {
        const existing = document.getElementById('lightboxImg');
        if (existing && existing.tagName === 'VIDEO') {
          existing.outerHTML = `<img class="lightbox__img" id="lightboxImg" src="" alt="" />`;
        }
        document.getElementById('lightboxImg').src = item.src;
        document.getElementById('lightboxImg').alt = item.title;
      }
      lbTitle.textContent = item.title;
      lbCat.textContent = item.cat;
      lbCounter.textContent = `${currentIndex + 1} / ${lightboxItems.length}`;
    }

    function openLightbox(index) {
      currentIndex = index;
      render();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() { lightbox.classList.remove('open'); document.body.style.overflow = ''; }

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.getElementById('lightboxPrev').addEventListener('click', (e) => {
      e.stopPropagation();
      currentIndex = (currentIndex - 1 + lightboxItems.length) % lightboxItems.length;
      render();
    });
    document.getElementById('lightboxNext').addEventListener('click', (e) => {
      e.stopPropagation();
      currentIndex = (currentIndex + 1) % lightboxItems.length;
      render();
    });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') { currentIndex = (currentIndex - 1 + lightboxItems.length) % lightboxItems.length; render(); }
      if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % lightboxItems.length; render(); }
    });
  </script>
</body>
</html>
